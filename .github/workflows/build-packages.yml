name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            script: package:mac:arm64
            kind: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            script: package:mac:x64
            kind: mac
          - runner: windows-latest
            platform: win32
            arch: x64
            script: package:windows:x64
            kind: windows
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            script: package:linux:x64
            kind: linux
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            script: package:linux:arm64
            kind: linux
            deb_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Package application
        working-directory: desktop
        run: npm run "${{ matrix.script }}"

      - name: Apply an ad-hoc signature and verify macOS application
        if: matrix.kind == 'mac' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm run sign:mac:adhoc -- "dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app"

      - name: Prepare artifact folder
        shell: bash
        run: mkdir -p artifacts

      - name: Archive macOS application
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "desktop/dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app" "artifacts/Orca-Seaflake-${version}-darwin-${{ matrix.arch }}.zip"

      - name: Build and verify macOS installer package
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          app_path="desktop/dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app"
          package_path="artifacts/Orca-Seaflake-${version}-darwin-${{ matrix.arch }}.pkg"
          pkgbuild \
            --component "$app_path" \
            --install-location /Applications \
            --identifier com.femifleming.orcaseaflake \
            --version "$version" \
            "$package_path"
          pkgutil --payload-files "$package_path" | grep -Fqx './Orca-Seaflake.app/Contents/Info.plist'
          expanded_package="$RUNNER_TEMP/orca-seaflake-pkg-${{ matrix.arch }}"
          pkgutil --expand-full "$package_path" "$expanded_package"
          grep -Fq 'install-location="/Applications"' "$expanded_package/PackageInfo"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            codesign --verify --deep --strict --verbose=2 "$expanded_package/Payload/Orca-Seaflake.app"
          fi

      - name: Archive Windows application
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          Compress-Archive -Path 'desktop/dist/Orca-Seaflake-win32-x64' -DestinationPath "artifacts/Orca-Seaflake-$version-win32-x64.zip" -CompressionLevel Optimal

      - name: Archive Linux application and create Debian package
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          app_dir="desktop/dist/Orca-Seaflake-linux-${{ matrix.arch }}"
          tar -czf "artifacts/Orca-Seaflake-${version}-linux-${{ matrix.arch }}.tar.gz" -C desktop/dist "Orca-Seaflake-linux-${{ matrix.arch }}"
          ./desktop/scripts/package-deb.sh "$app_dir" "${{ matrix.deb_arch }}" "../artifacts/orca-seaflake_${version}_${{ matrix.deb_arch }}.deb"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Seaflake-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30


  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add stable macOS download names
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          cp "release-assets/Orca-Seaflake-${version}-darwin-arm64.zip" "release-assets/Orca-Seaflake-darwin-arm64.zip"
          cp "release-assets/Orca-Seaflake-${version}-darwin-x64.zip" "release-assets/Orca-Seaflake-darwin-x64.zip"
          cp "release-assets/Orca-Seaflake-${version}-darwin-arm64.pkg" "release-assets/Orca-Seaflake-darwin-arm64.pkg"
          cp "release-assets/Orca-Seaflake-${version}-darwin-x64.pkg" "release-assets/Orca-Seaflake-darwin-x64.pkg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

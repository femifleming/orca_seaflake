name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            script: package:mac:arm64
            kind: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            script: package:mac:x64
            kind: mac
          - runner: windows-latest
            platform: win32
            arch: x64
            script: package:windows:x64
            kind: windows
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            script: package:linux:x64
            kind: linux
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            script: package:linux:arm64
            kind: linux
            deb_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Package application
        working-directory: desktop
        run: npm run "${{ matrix.script }}"

      - name: Apply an ad-hoc signature and verify macOS application
        if: matrix.kind == 'mac'
        working-directory: desktop
        run: npm run sign:mac:adhoc -- "dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app"

      - name: Prepare artifact folder
        shell: bash
        run: mkdir -p artifacts

      - name: Archive macOS application
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "desktop/dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app" "artifacts/Orca-Seaflake-${version}-darwin-${{ matrix.arch }}.zip"

      - name: Build and verify macOS installer package
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          app_path="desktop/dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app"
          package_path="artifacts/Orca-Seaflake-${version}-darwin-${{ matrix.arch }}.pkg"
          pkgbuild \
            --component "$app_path" \
            --install-location /Applications \
            --identifier com.femifleming.orcaseaflake \
            --version "$version" \
            "$package_path"
          pkgutil --payload-files "$package_path" | grep -Fqx './Orca-Seaflake.app/Contents/Info.plist'
          expanded_package="$RUNNER_TEMP/orca-seaflake-pkg-${{ matrix.arch }}"
          pkgutil --expand-full "$package_path" "$expanded_package"
          grep -Fq 'install-location="/Applications"' "$expanded_package/PackageInfo"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            codesign --verify --deep --strict --verbose=2 "$expanded_package/Payload/Orca-Seaflake.app"
          fi

      - name: Archive Windows application
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          Compress-Archive -Path 'desktop/dist/Orca-Seaflake-win32-x64' -DestinationPath "artifacts/Orca-Seaflake-$version-win32-x64.zip" -CompressionLevel Optimal

      - name: Archive Linux application and create Debian package
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          app_dir="desktop/dist/Orca-Seaflake-linux-${{ matrix.arch }}"
          tar -czf "artifacts/Orca-Seaflake-${version}-linux-${{ matrix.arch }}.tar.gz" -C desktop/dist "Orca-Seaflake-linux-${{ matrix.arch }}"
          ./desktop/scripts/package-deb.sh "$app_dir" "${{ matrix.deb_arch }}" "../artifacts/orca-seaflake_${version}_${{ matrix.deb_arch }}.deb"

      - name: Install the macOS .pkg and launch the app
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          sudo installer -pkg artifacts/*.pkg -target /
          test -d /Applications/Orca-Seaflake.app
          /Applications/Orca-Seaflake.app/Contents/MacOS/Orca-Seaflake > launch.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then echo "App exited during launch:"; cat launch.log; exit 1; fi
          kill "$pid"
          echo "Launched and stayed running for 20s"

      - name: Unzip the Windows build and launch the app
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item artifacts/*.zip).FullName -DestinationPath "$env:RUNNER_TEMP/orca"
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP/orca" -Recurse -Filter orca-seaflake.exe | Select-Object -First 1
          if (-not $exe) { throw 'orca-seaflake.exe not found in the zip' }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "App exited during launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output 'Launched and stayed running for 20s'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Seaflake-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30


  desktop-linux-install:
    name: install .deb on ${{ matrix.runner }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Download the Linux packages
        uses: actions/download-artifact@v4
        with:
          name: Orca-Seaflake-linux-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts

      - name: Install with apt, exactly as the README says, and launch
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/*.deb xvfb xauth
          command -v orca-seaflake
          test -f /usr/share/applications/orca-seaflake.desktop
          xvfb-run -a orca-seaflake > launch.log 2>&1 &
          sleep 25
          if ! pgrep -f /usr/lib/orca-seaflake/orca-seaflake > /dev/null; then echo "App exited during launch:"; cat launch.log; exit 1; fi
          pkill -f /usr/lib/orca-seaflake/orca-seaflake || true
          echo "Launched and stayed running for 25s"

  terminal:
    name: terminal ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, node: 20 }
          - { os: macos-15-intel, node: 20 }
          - { os: macos-15, node: 24 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 22 }
          - { os: ubuntu-22.04, node: 18 }
          - { os: ubuntu-24.04, node: 22 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: ubuntu-24.04-arm, node: 20 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the ALSA runtime, as the README says (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils

      - name: Run tests from source
        shell: bash
        working-directory: terminal
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Pack, then install globally the way users do
        shell: bash
        working-directory: terminal
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          npm install -g "./$tgz"
          orca-seaflake --version
          test "$(orca-seaflake --version)" = "$(node -p "require('./package.json').version")"
          orca-seaflake --midi
          orca-seaflake --help

  terminal-raspberry-pi:
    name: terminal ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Raspberry Pi OS 64-bit (bookworm)', image: 'debian:bookworm', platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { name: 'Raspberry Pi OS 64-bit (trixie)', image: 'debian:trixie', platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { name: 'Raspberry Pi OS 32-bit (trixie, emulated)', image: 'debian:trixie', platform: linux/arm/v7, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up ARM emulation
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      # No compilers are installed here on purpose: the install must use the
      # prebuilt MIDI binary, exactly as the README promises.
      - name: Follow the README install steps in a fresh system
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src/terminal ${{ matrix.image }} bash -euxc '
            apt-get update
            apt-get install -y nodejs npm alsa-utils
            node -v
            npm ci
            npm test
            npm install -g "./$(npm pack --silent)"
            orca-seaflake --version
            orca-seaflake --midi
          '

  pilot:
    name: pilot ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'macOS (universal)', runner: macos-15, kind: mac, arch: universal }
          - { name: 'Windows x64', runner: windows-latest, kind: windows, arch: x64 }
          - { name: 'Linux x64', runner: ubuntu-22.04, kind: linux, arch: x64 }
          - { name: 'Linux arm64', runner: ubuntu-22.04-arm, kind: linux, arch: arm64 }
    env:
      R: pilot/build/PilotRender_artefacts/Release/PilotRender
      HT: pilot/build/PilotHostTest_artefacts/Release/PilotHostTest
      VST3: pilot/build/PilotSealflake_artefacts/Release/VST3/Pilot Sealflake.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb xauth

      - name: Build tools (macOS)
        if: matrix.kind == 'mac'
        run: brew install ninja || true

      - name: Visual Studio environment (Windows)
        if: matrix.kind == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "${{ matrix.kind }}" == mac ]]; then extra+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"); fi
          if [[ "${{ matrix.kind }}" == windows ]]; then extra+=(-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl); fi
          cmake -S pilot -B pilot/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPILOT_COPY_PLUGINS=OFF "${extra[@]}"

      - name: Build
        run: cmake --build pilot/build --parallel 4

      - name: Test (Just Friends, Teletype + PI.*, classic Pilot, language, round robin)
        shell: bash
        run: |
          set -euo pipefail
          for m in jf pi legacy lang rr; do echo "== $m"; "$R" $m; done

      - name: Load the VST3 like a DAW
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == linux ]]; then xvfb-run -a "$HT" "$VST3"; else "$HT" "$VST3"; fi

      - name: Validate the Audio Unit (macOS)
        if: matrix.kind == 'mac'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "pilot/build/PilotSealflake_artefacts/Release/AU/Pilot Sealflake.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Pslf Slfk

      - name: Package (macOS)
        if: matrix.kind == 'mac'
        run: pilot/scripts/package-mac.sh pilot/build artifacts

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: pilot/scripts/package-windows.ps1 -Build pilot/build -Out artifacts

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: pilot/scripts/package-linux.sh pilot/build artifacts ${{ matrix.arch }}

      - name: Install the .pkg and launch the app (macOS)
        if: matrix.kind == 'mac'
        run: |
          set -euo pipefail
          sudo installer -pkg artifacts/*.pkg -target /
          test -d "/Library/Audio/Plug-Ins/VST3/Pilot Sealflake.vst3"
          "/Applications/Pilot Sealflake.app/Contents/MacOS/Pilot Sealflake" > launch.log 2>&1 &
          pid=$!; sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then echo "App exited during launch:"; cat launch.log; exit 1; fi
          kill "$pid"; echo "Launched and stayed running for 20s"

      - name: Unzip and launch the app (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item artifacts/*.zip).FullName -DestinationPath "$env:RUNNER_TEMP/pilot"
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP/pilot" -Recurse -Filter 'Pilot Sealflake.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Pilot Sealflake.exe not found in the zip' }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "App exited during launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output 'Launched and stayed running for 20s'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Pilot-Sealflake-${{ matrix.kind }}-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  pilot-linux-install:
    name: pilot install .deb on ${{ matrix.runner }}
    needs: pilot
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Download the Linux packages
        uses: actions/download-artifact@v4
        with:
          name: Pilot-Sealflake-linux-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts

      - name: Install with apt, exactly as the README says, and launch
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/*.deb xvfb xauth
          command -v pilot-sealflake
          test -d "/usr/lib/vst3/Pilot Sealflake.vst3"
          test -d "/usr/lib/lv2/Pilot Sealflake.lv2"
          xvfb-run -a pilot-sealflake > launch.log 2>&1 &
          sleep 20
          if ! pgrep -x pilot-sealflake > /dev/null; then echo "App exited during launch:"; cat launch.log; exit 1; fi
          pkill -x pilot-sealflake || true
          echo "Launched and stayed running for 20s"

      - name: The tar.gz installs for one user with install.sh
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf artifacts/*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/Pilot-Sealflake-*/install.sh
          test -x ~/.local/bin/pilot-sealflake
          test -d ~/.vst3/"Pilot Sealflake.vst3"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-linux-install, terminal, terminal-raspberry-pi, pilot, pilot-linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add stable download names (used by the README's direct links and Homebrew)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(node -p "require('./terminal/package.json').version")" = "${version}"
          cd release-assets
          for f in darwin-arm64.zip darwin-x64.zip darwin-arm64.pkg darwin-x64.pkg win32-x64.zip linux-x64.tar.gz linux-arm64.tar.gz; do
            cp "Orca-Seaflake-${version}-${f}" "Orca-Seaflake-${f}"
          done
          cp "orca-seaflake_${version}_amd64.deb" "orca-seaflake_amd64.deb"
          cp "orca-seaflake_${version}_arm64.deb" "orca-seaflake_arm64.deb"
          # Pilot Sealflake has its own version (pilot/CMakeLists.txt)
          pv="$(sed -n 's/^project(PilotSealflake VERSION \([0-9.]*\).*/\1/p' ../pilot/CMakeLists.txt)"
          for f in macos.zip macos.pkg windows-x64.zip linux-x64.tar.gz linux-arm64.tar.gz; do
            cp "Pilot-Sealflake-${pv}-${f}" "Pilot-Sealflake-${f}"
          done
          cp "pilot-sealflake_${pv}_amd64.deb" "pilot-sealflake_amd64.deb"
          cp "pilot-sealflake_${pv}_arm64.deb" "pilot-sealflake_arm64.deb"

      - name: Pack the terminal version
        shell: bash
        run: |
          set -euo pipefail
          cd terminal
          tgz="$(npm pack --silent)"
          cp "$tgz" "../release-assets/$tgz"
          cp "$tgz" ../release-assets/orca-seaflake-terminal.tgz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            script: package:mac:arm64
            kind: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            script: package:mac:x64
            kind: mac
          - runner: windows-latest
            platform: win32
            arch: x64
            script: package:windows:x64
            kind: windows
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            script: package:linux:x64
            kind: linux
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            script: package:linux:arm64
            kind: linux
            deb_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Check macOS release signing credentials
        if: matrix.kind == 'mac' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Cannot publish a macOS release until these GitHub Actions secrets are configured: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: matrix.kind == 'mac' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          certificate_path="$(mktemp)"
          keychain_path="$RUNNER_TEMP/orca-seaflake-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          if ! grep -Fq "$APPLE_DEVELOPER_IDENTITY" <<< "$identities"; then
            echo 'The imported certificate does not match APPLE_DEVELOPER_IDENTITY.' >&2
            exit 1
          fi

      - name: Package application
        working-directory: desktop
        run: npm run "${{ matrix.script }}"

      - name: Sign, notarize, and verify macOS application
        if: matrix.kind == 'mac' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run sign:mac:release -- "dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app"

      - name: Prepare artifact folder
        shell: bash
        run: mkdir -p artifacts

      - name: Archive macOS application
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "desktop/dist/Orca-Seaflake-darwin-${{ matrix.arch }}/Orca-Seaflake.app" "artifacts/Orca-Seaflake-${version}-darwin-${{ matrix.arch }}.zip"

      - name: Archive Windows application
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          Compress-Archive -Path 'desktop/dist/Orca-Seaflake-win32-x64' -DestinationPath "artifacts/Orca-Seaflake-$version-win32-x64.zip" -CompressionLevel Optimal

      - name: Archive Linux application and create Debian package
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          app_dir="desktop/dist/Orca-Seaflake-linux-${{ matrix.arch }}"
          tar -czf "artifacts/Orca-Seaflake-${version}-linux-${{ matrix.arch }}.tar.gz" -C desktop/dist "Orca-Seaflake-linux-${{ matrix.arch }}"
          ./desktop/scripts/package-deb.sh "$app_dir" "${{ matrix.deb_arch }}" "../artifacts/orca-seaflake_${version}_${{ matrix.deb_arch }}.deb"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Seaflake-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30


  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add stable macOS download names
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          cp "release-assets/Orca-Seaflake-${version}-darwin-arm64.zip" "release-assets/Orca-Seaflake-darwin-arm64.zip"
          cp "release-assets/Orca-Seaflake-${version}-darwin-x64.zip" "release-assets/Orca-Seaflake-darwin-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

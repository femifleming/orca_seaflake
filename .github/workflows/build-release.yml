name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libncursesw5-dev libform-dev libportmidi-dev dpkg-dev
      - name: Build
        run: ./tool build --portmidi orca
      - name: Package
        run: |
          mkdir -p dist/orca_seaflake-linux-x86_64/usr/bin dist/orca_seaflake-linux-x86_64/DEBIAN
          cp build/orca dist/orca_seaflake-linux-x86_64/usr/bin/orca_seaflake
          printf 'Package: orca-seaflake\nVersion: 0.1.0\nArchitecture: amd64\nMaintainer: Femi Shonuga-Fleming\nDepends: libncursesw6, libformw6, libportmidi0\nDescription: Orca C with the Seaflake MIDI operator\n' > dist/orca_seaflake-linux-x86_64/DEBIAN/control
          dpkg-deb --build dist/orca_seaflake-linux-x86_64 dist/orca_seaflake-linux-x86_64.deb
          tar -C dist/orca_seaflake-linux-x86_64/usr/bin -czf dist/orca_seaflake-linux-x86_64.tar.gz orca_seaflake
      - uses: actions/upload-artifact@v4
        with: {name: linux-x86_64, path: dist/*}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libncursesw5-dev libform-dev libportmidi-dev dpkg-dev
      - name: Build
        run: ./tool build --portmidi orca
      - name: Package
        run: |
          mkdir -p dist/orca_seaflake-debian-arm64/usr/bin dist/orca_seaflake-debian-arm64/DEBIAN
          cp build/orca dist/orca_seaflake-debian-arm64/usr/bin/orca_seaflake
          printf 'Package: orca-seaflake\nVersion: 0.1.0\nArchitecture: arm64\nMaintainer: Femi Shonuga-Fleming\nDepends: libncursesw6, libformw6, libportmidi0\nDescription: Orca C with the Seaflake MIDI operator\n' > dist/orca_seaflake-debian-arm64/DEBIAN/control
          dpkg-deb --build dist/orca_seaflake-debian-arm64 dist/orca_seaflake-debian-arm64.deb
          tar -C dist/orca_seaflake-debian-arm64/usr/bin -czf dist/orca_seaflake-debian-arm64.tar.gz orca_seaflake
      - uses: actions/upload-artifact@v4
        with: {name: linux-arm64, path: dist/*}

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ncurses portmidi
      - name: Build
        run: ./tool build --portmidi orca
      - name: Package app
        run: |
          mkdir -p "dist/Orca Seaflake.app/Contents/MacOS" "dist/Orca Seaflake.app/Contents/Resources"
          cp build/orca "dist/Orca Seaflake.app/Contents/Resources/orca"
          printf '#!/bin/sh\nexec /usr/bin/open -a Terminal "$PWD/Orca Seaflake.app/Contents/Resources/orca"\n' > "dist/Orca Seaflake.app/Contents/MacOS/orca-launcher"
          chmod +x "dist/Orca Seaflake.app/Contents/MacOS/orca-launcher"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict><key>CFBundleExecutable</key><string>orca-launcher</string><key>CFBundleIdentifier</key><string>com.femishonuga.orca-seaflake</string><key>CFBundleName</key><string>Orca Seaflake</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "dist/Orca Seaflake.app/Contents/Info.plist"
          tar -C dist -czf "dist/orca_seaflake-macos-${{ matrix.arch }}.tar.gz" "Orca Seaflake.app"
      - uses: actions/upload-artifact@v4
        with: {name: macos-${{ matrix.arch }}, path: dist/orca_seaflake-macos-${{ matrix.arch }}.tar.gz}

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pdcurses mingw-w64-x86_64-portmidi
      - name: Build
        run: |
          mkdir -p build
          gcc -std=c99 -O2 -DNDEBUG -DFEAT_PORTMIDI -DORCA_OS_WINDOWS -I/mingw64/include/pdcurses -Ithirdparty -o build/orca_seaflake.exe gbuffer.c field.c vmio.c sim.c osc_out.c term_util.c sysmisc.c thirdparty/oso.c tui_main.c -lpdcurses -lportmidi -lws2_32
      - name: Package
        run: |
          mkdir -p dist/orca_seaflake
          cp build/orca_seaflake.exe dist/orca_seaflake/
          cp /mingw64/bin/libpdcurses.dll /mingw64/bin/libportmidi.dll dist/orca_seaflake/
          cp /mingw64/bin/libgcc_s_seh-1.dll /mingw64/bin/libstdc++-6.dll /mingw64/bin/libwinpthread-1.dll dist/orca_seaflake/ || true
          cd dist && zip -r orca_seaflake-windows-x86_64.zip orca_seaflake
      - uses: actions/upload-artifact@v4
        with: {name: windows-x86_64, path: dist/orca_seaflake-windows-x86_64.zip}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, linux-arm64, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist}
      - name: Flatten
        run: find dist -type f -exec cp {} . \;
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.deb
            *.zip
